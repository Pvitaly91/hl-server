name: windows-build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show CMake version
        shell: pwsh
        run: cmake --version

      - name: Configure
        shell: pwsh
        run: cmake --preset vs2022-win32

      - name: Build Release
        shell: pwsh
        run: cmake --build --preset release
